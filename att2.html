<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapão do Davizão</title>

    <style>
        caption {
            font-size: 22px;
            font-weight: bold;
            color: #174a8b;
            padding: 15px;
        }
        body{
            background-color:blue;
        }
        table{
            width: 100%;
            border: 2px solid;
        }
        thead{
            background-color: darkblue;
            color: white;
        }
        tbody{
            color: black;
            background-color:rgb(0, 157, 255);
        }
        tfoot{
            background-color:darkblue;
            color: white;
        }
        .container {
            width: 80%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #b0c4de;
            text-align: center;
            justify-content: center; 
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
    <caption>Cardapão</caption>
<table border="1">
    <thead>
        <tr style="font-size: 30px;">

            <th>ID</th>
            <th>Roupa</th>
            <th>Preço</th>
            <th>Tamanho</th>
        </tr>
    </thead>

    <tbody>
        <tr style="font-size: 30px;">

            <th>1</th>
            <th>camiseta</th>
            <th>60,00</th>
            <th>P,M,G</th>
        </tr>
        <tr style="font-size: 30px;">
            <th>2</th>
            <th>calça</th>
            <th>80,00</th>
            <th>M,G</th>
        </tr>
        <tr style="font-size: 30px;">
            <th>3</th>
            <th>blusa</th>
            <th>70,00</th>
            <th>P,G</th>
        </tr>
    </tbody>

    <tfoot>
        <th style="font-size: 30px;" colspan="4">Loja de Roupa</th>
    </tfoot>
    </div>
</body>
</html>
