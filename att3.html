<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque de Informática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <table>
            <caption>Estoque de Informática</caption>

            <thead>
                <tr>
                    <th colspan="2">Informações do produto</th>
                    <th colspan="2">Estoque</th>
                </tr>
                <tr>
                    <th>Categoria</th>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td rowspan="2">Periféricos</td>
                    <td>Mouse</td>
                    <td>R$ 50,00</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Teclado</td>
                    <td>R$ 120,00</td>
                    <td>3</td>
                </tr>

                <tr>
                    <td rowspan="2">Hardware</td>
                    <td>Memória RAM</td>
                    <td>R$ 180,00</td>
                    <td>8</td>
                </tr>
                <tr>
                    <td>SSD</td>
                    <td>R$ 250,00</td>
                    <td>4</td>
                </tr>

                <tr>
                    <td rowspan="2">Acessórios</td>
                    <td>Webcam</td>
                    <td>R$ 150,00</td>
                    <td>6</td>
                </tr>
                <tr>
                    <td>Headset</td>
                    <td>R$ 90,00</td>
                    <td>2</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3">Total de unidades em estoque</td>
                    <td>33</td>
                </tr>
            </tfoot>
        </table>
    </div>

</body>
</html>
